# Backend checks. Path-filtered: only runs when the backend (or this workflow) changes (ADR-0011).
name: backend

on:
  pull_request:
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-ci.yml'
      - '.node-version'
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-ci.yml'
      - '.node-version'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/backend

jobs:
  static-and-unit:
    name: lint, types, boundaries, unit, build
    runs-on: ubuntu-latest
    # A stuck runner fails fast instead of waiting for the 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run depcheck:boundaries
      - run: npm test
      - run: npm run build

  integration-and-e2e:
    name: integration + e2e (Testcontainers)
    runs-on: ubuntu-latest
    # A stuck runner fails fast instead of waiting for the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - run: npm run test:integration
      - run: npm run test:e2e
