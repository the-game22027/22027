# Mobile checks. Path-filtered: only runs when the app (or this workflow) changes (ADR-0011).
name: mobile

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/mobile

jobs:
  analyze-test-build:
    name: format, analyze, test, build dev apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same Flutter version as every developer machine: read it from .fvmrc.
      - name: Read Flutter version from .fvmrc
        id: flutter-version
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - run: flutter pub get

      # Generated code (packages/api_client, lib/l10n/generated) is excluded.
      - run: dart format --set-exit-if-changed lib test

      - run: flutter analyze

      - run: flutter test

      - run: flutter build apk --flavor dev --debug --dart-define-from-file=config/dev.json
