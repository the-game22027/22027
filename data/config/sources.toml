license_note = "Scraped from transfermarkt.com, whose terms forbid scraping. Pending in DEC-66"
base_url = "https://pub-e682421888d945d684bcae8890b0ec20.r2.dev/data/"
files = [
  "competitions.csv.gz",
  "clubs.csv.gz",
