# ---- Precedence (07 §5.10) ----
# For each fact, the first listed source that has it gives a CONFLICT's provisional value, and a
# SINGLE_SOURCE fact is trusted only from a listed source. A rule names competitions, or a team kind for the
# rest.

[[precedence]]
fact = "MATCH_RESULT"
competitions = ["world-cup"]
sources = ["fjelstul", "transfermarkt", "martj42"]

[[precedence]]
fact = "MATCH_RESULT"
team_kind = "NATIONAL_TEAM"
sources = ["martj42", "transfermarkt"]

[[precedence]]
fact = "MATCH_RESULT"
team_kind = "CLUB"
sources = ["transfermarkt", "openfootball", "xgabora"]

# ---- martj42 team names by date ----
# martj42 files a team's older matches under its current name. Where the team was a different Wikidata item
# then, a dated rule says which. Evidence: Fjelstul (T-67) and Transfermarkt (23380) both name the 2006 World
# Cup team "Serbia and Montenegro" (Q1131732, which is also FR Yugoslavia at Euro 2000); Serbia's first match
# as Serbia was in August 2006.
[[martj42_team_names]]
name = "Serbia"
until = "2006-07-31"
entity_ref = "wikidata:Q1131732"
