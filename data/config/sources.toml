# ---- Coverage windows (ADR-0022, 07 §5.10 D.3c) ----
# Which competitions (config/competitions.toml keys) and which dates each source covers. Outside its window a
# source is silent: `kb ingest:matches` does not load its rows there, and a match it lacks there is no
# evidence of anything. Inside its window, a match it lacks is listed in core.match.missing_from.
# `to = "latest"` means the source's last match date in that competition, read from its files at each run.

[[coverage]]
source = "fjelstul"
competitions = ["world-cup"]
from = "1930-01-01"
to = "2022-12-31"

# Transfermarkt: from its first season per competition (raw.transfermarkt__games, checked 2026-11-18) to its
# last row there. The dataset froze on 2026-07-06, but its rows end earlier: the 2026 World Cup on 2026-06-28
# (group stage only), the Champions League on 2026-05-06 (before the final).
[[coverage]]
source = "transfermarkt"
competitions = [
  "champions-league", "europa-league", "uefa-super-cup",
  "premier-league", "la-liga", "serie-a", "bundesliga", "ligue-1", "primeira-liga", "eredivisie",
  "fa-cup", "community-shield", "copa-del-rey", "supercopa-de-espana", "coppa-italia", "supercoppa-italiana",
  "dfb-pokal", "dfl-supercup", "trophee-des-champions", "supertaca", "knvb-cup", "johan-cruyff-shield",
]
from = "2012-07-01"
to = "latest"

[[coverage]]
source = "transfermarkt"
competitions = ["conference-league"]
from = "2021-07-01"
to = "latest"

[[coverage]]
source = "transfermarkt"
