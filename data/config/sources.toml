# D.3 source registry (07 §5.10, ADR-0022). `python -m kb sources:fetch` downloads every file listed here
# into data/raw_downloads/ and loads it, exactly as downloaded, into raw.<source>__<file>.
# Licences are recorded, not decided: DEC-66.

[[sources]]
