# Competitions for match data (07 §5.10 D.3d, DEC-67). One entry per competition: each source's own ids map
# to one Wikidata item. Tiers are not repeated here: they come from config/tiers.toml, and
# `kb ingest:matches` refuses to run if the two files disagree (an id in one file only, or one competition
# whose ids sit in two tiers).
#
# kind: LEAGUE (domestic league), CUP (any club cup: domestic cups and super cups, UEFA club competitions),
# INTERNATIONAL (national-team tournament; its teams are NATIONAL_TEAM entities).
# fjelstul ids are tournament series: "WC" covers WC-2002 … WC-2022 (the men's tournaments in tiers.toml).
# Wikidata items and labels checked on 2026-11-18 (Transfermarkt competition id P12758 where Wikidata has it).
# edition_labels: final year → the edition's official name, for tournaments played after their name year.

# DEC-67 filters, applied when rows are loaded.
first_match_date = "2000-01-01"
# Transfermarkt round names: qualifiers, preliminary rounds ("2.Vorrunde" is the KNVB Cup's) and play-offs are dropped...
excluded_round_pattern = '(?i)qualif|prelim|vorrunde|play-?off|relegation|friendl'
# ...except the third-place match of a tournament, which Transfermarkt calls "Third Place Play-Off".
kept_round_pattern = '(?i)third place'
# martj42 tournament names
excluded_tournament_pattern = '(?i)qualification|friendly'

